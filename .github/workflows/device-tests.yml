name: Device Tests

# dotnet-build.yml calls this workflow, so the device tests are part of the Build run and its jobs can wait for them.
on:
    workflow_call:
    workflow_dispatch:
        inputs:
            test-filter:
                description: 'TestFilter, for example Category=IconTintColorBehavior or SkipCategories=A,B (empty runs every test). A platform with no test of the category fails (exit code 94).'
                required: false
                default: ''
            run-everything:
                description: 'Also run the tests that each job declares its runner cannot run (empties DEVICE_TEST_SKIP_CAPABILITIES), to find out whether the runner can run them now'
                required: false
                type: boolean
                default: false
            configuration:
                description: 'Build configuration of the device test app: Release, as apps ship, or Debug (readable exception messages, line numbers in stack traces)'
                required: false
                type: choice
                default: 'Release'
                options:
                    - Release
                    - Debug

permissions:
    contents: read

env:
    DOTNET_NOLOGO: true
    DOTNET_CLI_TELEMETRY_OPTOUT: true
    TEST_FILTER: ${{ inputs.test-filter }}
    # Release, the configuration that apps ship in (eng/devices/README.md, "CI"). Both steps of a job pass it: the test step looks for the
    # app that the build step made for that configuration.
    DEVICE_TEST_CONFIGURATION: ${{ inputs.configuration || 'Release' }}

# No concurrency group: called from dotnet-build.yml, the Build run's group cancels this workflow with the rest of the run (a group of
# its own would be the caller's, since github.workflow is the caller's name there, and deadlock with it); a manual run cancels nothing.

# The iOS app is built once, without coverage, for the older iOS versions (device_tests_ios_app, device_tests_ios_runtime); the iOS 27.2 job builds its own,
# instrumented one.
# Every job builds and tests with eng/devices/run.ps1, the command that runs the device tests on a developer's machine too
# (eng/devices/LOCAL.md), so this file shows how to run them. -Platform is explicit because without it run.ps1 runs every platform of the
# machine and, for a Category= filter, skips a platform that has no test of the category instead of failing with 94.
jobs:
    # Collecting coverage (DEVICE_TEST_COVERAGE; eng/devices/README.md, "Code coverage") builds the app with instrumented toolkit
    # assemblies, so a manual run collects none: nothing merges it there, a run with a filter covers only part of the
    # tests, and a run started to answer a question does not need the instrumentation. In a called workflow, github.event_name is the
    # caller's event, so != 'workflow_dispatch' is true in a Build run only.
    device_tests_android:
        name: Device Tests (Android API ${{ matrix.api-level }})
        permissions:
            contents: read
        # Pinned: ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19 (actions/runner-images #14748).
        runs-on: ubuntu-24.04
        # 110 minutes: the API 36 leg also builds the app in its test step (coverage), with the emulator running.
        timeout-minutes: 110
        strategy:
            fail-fast: false
            matrix:
                api-level: [ 36, 28 ]
                include:
                    # The API 28 x86_64 image (google_apis r11, PSR1.180720.122, a 2020 build) turns on GLDMA, YUVCache and YUV420888toNV21
                    # (its advancedFeatures.ini; the arm64 API 28 images turn on none of them). Its YUV buffers then go through the host's YUV
                    # converter, which aborted the whole emulator ("FATAL | Unknown format: 0x18", gfxstream's getYUVOffsets, emulator
                    # 37.2.12) as soon as the first Camera test started the preview. Turned off, the image handles YUV itself, as the
                    # arm64 API 28 images do. (On an arm64 API 28 image, turning them on makes YUV images that an app writes read back as
                    # zeros: the YUV round trip of CameraManagerCaptureAndroidTests fails.) The API 36 image turns on GLDMA and YUVCache with
                    # a newer guest and ran every test.
                    -   api-level: 28
                        emulator-features: -feature -GLDMA,-YUVCache,-YUV420888toNV21
        env:
            # One Android level is enough for the merged coverage report; API 28 runs without the instrumented build.
            DEVICE_TEST_COVERAGE: ${{ github.event_name != 'workflow_dispatch' && matrix.api-level == 36 }}
            # OnDeviceSpeech: the emulator image gets no Play updates, so its on-device recognizer may have no language installed or never
            # answer, and then every OfflineSpeechToTextTests question waits 30 s (25 rows on API 36), which can exceed the time budget.
            # Delete it when a run-everything run shows those rows passing, or skipping without the 30 s waits, on both API levels.
            DEVICE_TEST_SKIP_CAPABILITIES: ${{ !inputs.run-everything && 'OnDeviceSpeech' || '' }}
            # SecondCamera: the emulator has a back and a front camera (-camera-front emulated below), so the two-camera tests fail, instead of
            # skipping, if the emulator options ever lose one.
            DEVICE_TEST_REQUIRE_CAPABILITIES: 'SecondCamera'
        steps:
            -   name: Checkout code
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Load shared environment variables
                uses: ./.github/actions/load-shared-env

            -   name: Install .NET SDK v${{ env.TOOLKIT_NET_VERSION }}
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    dotnet-version: ${{ env.TOOLKIT_NET_VERSION }}
                    dotnet-quality: 'ga'

            -   uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
                with:
                    distribution: 'microsoft'
                    java-version: '17'

            -   name: Locate the .NET install
                id: dotnet-root
                shell: bash
                run: |
                    p=$(dirname "$(readlink -f "$(command -v dotnet)")"); echo "path=$p" | tee -a "$GITHUB_OUTPUT"
                    echo "sdk=$(dotnet --version)" | tee -a "$GITHUB_OUTPUT"
                    wv=$(dotnet workload search version --take 1); test -n "$wv" || { echo '::error::No workload set found for this SDK band.'; exit 1; }; echo "workload-version=$wv" | tee -a "$GITHUB_OUTPUT"

            # global.json rolls forward to the newest SDK on the runner (10.0.403 on ubuntu-24.04, not the 10.0.100 that setup-dotnet installs),
            # and the runners install workload sets, so the key names the SDK that runs and the newest workload set of its band, and the install
            # pins that version: a new workload release starts a new cache instead of being hidden by an old one.
            -   name: Cache .NET workload packs
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: |
                        ${{ steps.dotnet-root.outputs.path }}/packs
                        ${{ steps.dotnet-root.outputs.path }}/sdk-manifests
                        ${{ steps.dotnet-root.outputs.path }}/metadata/workloads
                        ${{ steps.dotnet-root.outputs.path }}/template-packs
                    key: dotnet-workload-maui-android-${{ runner.os }}-${{ runner.arch }}-${{ steps.dotnet-root.outputs.sdk }}-${{ steps.dotnet-root.outputs.workload-version }}

            # Keyed on the files that decide which packages a restore needs. A changed key restores from nuget.org (about 5 s for these projects
            # on the runners), and the job saves the cache when it succeeds.
            -   name: Cache NuGet packages
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: ~/.nuget/packages
                    key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'NuGet.config', 'global.json', '.config/dotnet-tools.json') }}

            # Directory.Build.targets removes the iOS and Mac Catalyst target frameworks on Linux, so restore only needs Android.
            -   name: Install .NET MAUI Android Workload
                run: dotnet workload install maui-android --version ${{ steps.dotnet-root.outputs.workload-version }}

            -   name: Display dotnet info
                run: dotnet --info

            -   name: Restore .NET tools
                id: tools
                run: dotnet tool restore

            -   name: Enable KVM
                run: |
                    echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                    sudo udevadm control --reload-rules
                    # --settle returns once udevd has applied the rule; without it, trigger only queues the event and the check below can run first.
                    sudo udevadm trigger --name-match=kvm --settle
                    # Without a usable /dev/kvm the emulator action only warns and runs the x86_64 emulator with -accel off, far too slowly.
                    if ! { test -r /dev/kvm && test -w /dev/kvm; }; then
                        echo '::error::/dev/kvm is not usable, so the Android emulator cannot use hardware acceleration.'
                        exit 1
                    fi

            -   name: Runner diagnostics
                run: |
                    nproc
                    free -h
                    df -h "$GITHUB_WORKSPACE" "$HOME"

            # A job that collects coverage builds in its test step instead: the app is built once, with the instrumented toolkit assemblies,
            # and the coverlet process that instrumented them must still run when the tests have run (eng/devices/README.md, "Code coverage").
            -   name: Build device test apps
                if: ${{ env.DEVICE_TEST_COVERAGE != 'true' }}
                run: pwsh ./eng/devices/run.ps1 -Platform android -Target buildOnly -Configuration "$DEVICE_TEST_CONFIGURATION"

            # Runs even when the build step failed: run.ps1 then reports Not run (71) with the build error.
            -   name: Run device tests
                if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
                uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
                with:
                    api-level: ${{ matrix.api-level }}
                    target: google_apis
                    arch: x86_64
                    profile: pixel_7_pro
                    cores: 4
                    ram-size: 4096M
                    disk-size: 6000M
                    force-avd-creation: false
                    # No snapshot: the action appends the hardware settings (cores, RAM, disk) to the AVD's config.ini each time it starts an
                    # emulator, so a saved snapshot never matched the next start's configuration ("The emulator is starting from scratch.
                    # Reason: different AVD configuration") and every run cold-booted anyway. AVDs that avdmanager creates have no front
                    # camera (hw.camera.front=none); -camera-front emulated adds one for the two-camera tests.
                    emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated ${{ matrix.emulator-features }}
                    disable-animations: true
                    # 50 minutes: the tests of every package took 14.7 minutes on API 36 and 14.6 on API 28 on this runner (232630d9, three apps then) and
                    # 13.4 minutes on an arm64 emulator on an M4 Max (one app); a slow runner is about 2x slower.
                    # -ResultsFolder, not -Results: the coverage upload below reads this exact folder, and the coverage report is named after it.
                    script: pwsh ./eng/devices/run.ps1 -Platform android -Target ${{ env.DEVICE_TEST_COVERAGE == 'true' && 'buildAndTest' || 'testOnly' }} -Configuration "$DEVICE_TEST_CONFIGURATION" -DeviceId emulator-5554 -Timeout 00:50:00 -ResultsFolder artifacts/device-tests/android-api${{ matrix.api-level }}

            -   name: Upload device test results
                if: always()
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
                with:
                    name: device-tests-android-api${{ matrix.api-level }}
                    path: |
                        artifacts/device-tests/
                        artifacts/logs/

            -   name: Upload device test coverage
                if: ${{ !cancelled() && env.DEVICE_TEST_COVERAGE == 'true' }}
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
                with:
                    name: coverage-device-tests-android-api${{ matrix.api-level }}
                    path: artifacts/device-tests/android-api${{ matrix.api-level }}/coverage/*.cobertura.xml
                    if-no-files-found: warn

    device_tests_ios:
        name: Device Tests (iOS Simulator)
        permissions:
            contents: read
        runs-on: xcode-27
        # Release compiles every assembly ahead of time with LLVM: about 12 minutes for the test app on a busy M4 Max, against 1.5 in Debug.
        timeout-minutes: 120
        env:
            DEVICE_TEST_COVERAGE: ${{ github.event_name != 'workflow_dispatch' }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Load shared environment variables
                uses: ./.github/actions/load-shared-env

            -   name: Set Xcode Version
                uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
                with:
                    xcode-version: ${{ env.CommunityToolkitSample_Xcode_Version }}

            # The app builds against the Xcode 27 SDK, which the workload packs of the latest .NET SDK feature band support (as in build_sample).
            -   name: Install Latest .NET SDK, v${{ env.LATEST_NET_VERSION }}
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    dotnet-version: ${{ env.LATEST_NET_VERSION }}
                    dotnet-quality: 'ga'

            -   name: Locate the .NET install
                id: dotnet-root
                shell: bash
                run: |
                    p=$(dirname "$(readlink -f "$(command -v dotnet)")"); echo "path=$p" | tee -a "$GITHUB_OUTPUT"
                    echo "sdk=$(dotnet --version)" | tee -a "$GITHUB_OUTPUT"
                    wv=$(dotnet workload search version --take 1); test -n "$wv" || { echo '::error::No workload set found for this SDK band.'; exit 1; }; echo "workload-version=$wv" | tee -a "$GITHUB_OUTPUT"

            # global.json rolls forward to the newest SDK on the runner, which can be newer than the one setup-dotnet installed, and the
            # runners install workload sets, so the key names the SDK that runs and the newest workload set of its band, and the install
            # pins that version: a new workload release starts a new cache instead of being hidden by an old one.
            -   name: Cache .NET workload packs
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: |
                        ${{ steps.dotnet-root.outputs.path }}/packs
                        ${{ steps.dotnet-root.outputs.path }}/sdk-manifests
                        ${{ steps.dotnet-root.outputs.path }}/metadata/workloads
                        ${{ steps.dotnet-root.outputs.path }}/template-packs
                    key: dotnet-workload-maui-${{ runner.os }}-${{ runner.arch }}-${{ steps.dotnet-root.outputs.sdk }}-${{ steps.dotnet-root.outputs.workload-version }}

            # Keyed on the files that decide which packages a restore needs. A changed key restores from nuget.org (about 5 s for these projects
            # on the runners), and the job saves the cache when it succeeds.
            -   name: Cache NuGet packages
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: ~/.nuget/packages
                    key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'NuGet.config', 'global.json', '.config/dotnet-tools.json') }}

            # Restore evaluates every target framework of the toolkit libraries, so Android and Mac Catalyst are needed too.
            -   name: Install .NET MAUI Workload
                run: dotnet workload install maui --version ${{ steps.dotnet-root.outputs.workload-version }}

            -   name: Display dotnet info
                run: dotnet --info

            -   name: Restore .NET tools
                id: tools
                run: dotnet tool restore

            -   name: Runner diagnostics
                run: |
                    sw_vers
                    sysctl -n hw.ncpu hw.memsize
                    xcrun simctl list runtimes
                    system_profiler SPAudioDataType SPCameraDataType || true

            # A job that collects coverage builds in its test step instead: the app is built once, with the instrumented toolkit assemblies,
            # and the coverlet process that instrumented them must still run when the tests have run (eng/devices/README.md, "Code coverage").
            -   name: Build device test apps
                if: ${{ env.DEVICE_TEST_COVERAGE != 'true' }}
                run: pwsh ./eng/devices/run.ps1 -Platform ios -Target buildOnly -Configuration "$DEVICE_TEST_CONFIGURATION"

            # 60 minutes: the tests of every package took 22 minutes on this runner (232630d9; 3 M1 cores, runs vary by about 30%).
            -   name: Run device tests
                if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
                run: pwsh ./eng/devices/run.ps1 -Platform ios -Target ${{ env.DEVICE_TEST_COVERAGE == 'true' && 'buildAndTest' || 'testOnly' }} -Configuration "$DEVICE_TEST_CONFIGURATION" -Timeout 01:00:00

            -   name: Upload device test results
                if: always()
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
                with:
                    name: device-tests-ios
                    path: |
                        artifacts/device-tests/
                        artifacts/logs/

            -   name: Upload device test coverage
                if: ${{ !cancelled() && env.DEVICE_TEST_COVERAGE == 'true' }}
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
                with:
                    name: coverage-device-tests-ios
                    path: artifacts/device-tests/ios/coverage/*.cobertura.xml
                    if-no-files-found: warn

    # Builds the iOS simulator app once, without coverage, for device_tests_ios_runtime. device_tests_ios cannot share it: it collects
    # coverage, so it builds an instrumented app in its test step.
    device_tests_ios_app:
        name: Device Tests (iOS app for older iOS versions)
        permissions:
            contents: read
        runs-on: xcode-27
        # The Release build took 9.4 to 16.7 minutes on this runner (three runs, 2026-11-07/08).
        timeout-minutes: 60
        env:
            DEVICE_TEST_COVERAGE: false
        steps:
            -   name: Checkout code
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Load shared environment variables
                uses: ./.github/actions/load-shared-env

            -   name: Set Xcode Version
                uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
                with:
                    xcode-version: ${{ env.CommunityToolkitSample_Xcode_Version }}

            -   name: Install Latest .NET SDK, v${{ env.LATEST_NET_VERSION }}
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    dotnet-version: ${{ env.LATEST_NET_VERSION }}
                    dotnet-quality: 'ga'

            -   name: Locate the .NET install
                id: dotnet-root
                shell: bash
                run: |
                    p=$(dirname "$(readlink -f "$(command -v dotnet)")"); echo "path=$p" | tee -a "$GITHUB_OUTPUT"
                    echo "sdk=$(dotnet --version)" | tee -a "$GITHUB_OUTPUT"
                    wv=$(dotnet workload search version --take 1); test -n "$wv" || { echo '::error::No workload set found for this SDK band.'; exit 1; }; echo "workload-version=$wv" | tee -a "$GITHUB_OUTPUT"

            -   name: Cache .NET workload packs
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: |
                        ${{ steps.dotnet-root.outputs.path }}/packs
                        ${{ steps.dotnet-root.outputs.path }}/sdk-manifests
                        ${{ steps.dotnet-root.outputs.path }}/metadata/workloads
                        ${{ steps.dotnet-root.outputs.path }}/template-packs
                    key: dotnet-workload-maui-${{ runner.os }}-${{ runner.arch }}-${{ steps.dotnet-root.outputs.sdk }}-${{ steps.dotnet-root.outputs.workload-version }}

            -   name: Cache NuGet packages
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: ~/.nuget/packages
                    key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'NuGet.config', 'global.json', '.config/dotnet-tools.json') }}

            -   name: Install .NET MAUI Workload
                run: dotnet workload install maui --version ${{ steps.dotnet-root.outputs.workload-version }}

            -   name: Build device test app
                run: pwsh ./eng/devices/run.ps1 -Platform ios -Target buildOnly -Configuration "$DEVICE_TEST_CONFIGURATION"

            # A zipped artifact loses file modes (actions/upload-artifact, "Permission Loss"), and the app's executable must stay executable.
            # The glob follows the repo's NetVersion and the runner's architecture instead of naming net10.0-ios/iossimulator-arm64.
            -   name: Pack the app
                shell: bash
                run: |
                    cd src/CommunityToolkit.Maui.DeviceTests
                    shopt -s nullglob
                    apps=(bin/"$DEVICE_TEST_CONFIGURATION"/net*-ios/iossimulator-*/*.app)
                    if [ "${#apps[@]}" -ne 1 ]; then
                        echo "::error::Expected one iOS simulator app, found ${#apps[@]}: ${apps[*]}"
                        exit 1
                    fi
                    tar -czf "$RUNNER_TEMP/ios-simulator-app.tgz" "${apps[0]}"
                    ls -l "$RUNNER_TEMP/ios-simulator-app.tgz"

            -   name: Upload the app
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
                with:
                    name: ios-simulator-app
                    path: ${{ runner.temp }}/ios-simulator-app.tgz
                    compression-level: 0
                    # 3 days, so that re-running only a failed iOS 26.5 job a day later still finds the app.
                    retention-days: 3
                    if-no-files-found: error

            -   name: Upload build logs
                if: failure()
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
                with:
                    name: device-tests-ios-app-logs
                    path: artifacts/logs/

    # The app of device_tests_ios_app on the iOS versions that the xcode-27 image has no simulator runtime for (it has iOS 27.x only).
    # The macos-26 image has the iOS 26.2, 26.4 and 26.5 runtimes (its readme, "Installed Simulators"), so nothing is downloaded, and
    # XHarness brings its own mlaunch, so the app that Xcode 27.1 built (minimum iOS 15.0) runs here under Xcode 26.x. No coverage:
    # device_tests_ios collects the iOS coverage.
    device_tests_ios_runtime:
        name: Device Tests (iOS ${{ matrix.ios-version }} Simulator)
        needs: [ device_tests_ios_app ]
        permissions:
            contents: read
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                include:
                    # iOS 26.5: 9 StatusBar tests failed on it (a maintainer's run, 2026-11) while they pass on iOS 27.2.
                    -   ios-version: '26.5'
                        runner: macos-26
                        xcode: '26.6'
        env:
            DEVICE_TEST_COVERAGE: false
        steps:
            -   name: Checkout code
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Load shared environment variables
                uses: ./.github/actions/load-shared-env

            -   name: Set Xcode Version
                uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
                with:
                    xcode-version: ${{ matrix.xcode }}

            # The test step reads the app's properties with dotnet msbuild (ios.ps1), which evaluates the net*-ios target framework.
            -   name: Install Latest .NET SDK, v${{ env.LATEST_NET_VERSION }}
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    dotnet-version: ${{ env.LATEST_NET_VERSION }}
                    dotnet-quality: 'ga'

            -   name: Locate the .NET install
                id: dotnet-root
                shell: bash
                run: |
                    p=$(dirname "$(readlink -f "$(command -v dotnet)")"); echo "path=$p" | tee -a "$GITHUB_OUTPUT"
                    echo "sdk=$(dotnet --version)" | tee -a "$GITHUB_OUTPUT"
                    wv=$(dotnet workload search version --take 1); test -n "$wv" || { echo '::error::No workload set found for this SDK band.'; exit 1; }; echo "workload-version=$wv" | tee -a "$GITHUB_OUTPUT"

            # Same key as the xcode-27 jobs: both images have .NET SDK 10.0.403 today, so this restores their cache.
            -   name: Cache .NET workload packs
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: |
                        ${{ steps.dotnet-root.outputs.path }}/packs
                        ${{ steps.dotnet-root.outputs.path }}/sdk-manifests
                        ${{ steps.dotnet-root.outputs.path }}/metadata/workloads
                        ${{ steps.dotnet-root.outputs.path }}/template-packs
                    key: dotnet-workload-maui-${{ runner.os }}-${{ runner.arch }}-${{ steps.dotnet-root.outputs.sdk }}-${{ steps.dotnet-root.outputs.workload-version }}

            # No NuGet cache: this job restores no project, and a cache it saved would hold only the tools.
            -   name: Install .NET MAUI Workload
                run: dotnet workload install maui --version ${{ steps.dotnet-root.outputs.workload-version }}

            -   name: Restore .NET tools
                id: tools
                run: dotnet tool restore

            -   name: Runner diagnostics
                run: |
                    sw_vers
                    sysctl -n hw.ncpu hw.memsize
                    xcrun simctl list runtimes

            -   name: Download the app
                uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
                with:
                    name: ios-simulator-app
                    path: ${{ runner.temp }}

            -   name: Unpack the app
                id: unpack
                run: tar -xzf "$RUNNER_TEMP/ios-simulator-app.tgz" -C src/CommunityToolkit.Maui.DeviceTests

            # 60 minutes, as device_tests_ios. -Runtime picks the runtime by version; the device type is still the runtime's first iPhone with
            # one built-in screen.
            -   name: Run device tests
                if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.unpack.outcome == 'success' }}
                run: pwsh ./eng/devices/run.ps1 -Platform ios -Target testOnly -Configuration "$DEVICE_TEST_CONFIGURATION" -Runtime '${{ matrix.ios-version }}' -Timeout 01:00:00 -ResultsFolder 'artifacts/device-tests/ios-${{ matrix.ios-version }}'

            -   name: Upload device test results
                if: always()
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
                with:
                    name: device-tests-ios-${{ matrix.ios-version }}
                    path: |
                        artifacts/device-tests/
                        artifacts/logs/

    device_tests_maccatalyst:
        name: Device Tests (Mac Catalyst)
        permissions:
            contents: read
        runs-on: xcode-27
        timeout-minutes: 90
        env:
            # Camera: the runner VM has no camera and no step can add one (local runs on a Mac run these tests). Delete it if the runner
            # image gains a camera.
            DEVICE_TEST_SKIP_CAPABILITIES: ${{ !inputs.run-everything && 'Camera' || '' }}
            DEVICE_TEST_COVERAGE: ${{ github.event_name != 'workflow_dispatch' }}
            HOMEBREW_NO_AUTO_UPDATE: 1
        steps:
            -   name: Checkout code
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Load shared environment variables
                uses: ./.github/actions/load-shared-env

            -   name: Set Xcode Version
                uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
                with:
                    xcode-version: ${{ env.CommunityToolkitSample_Xcode_Version }}

            # The app builds against the Xcode 27 SDK, which the workload packs of the latest .NET SDK feature band support (as in build_sample).
            -   name: Install Latest .NET SDK, v${{ env.LATEST_NET_VERSION }}
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    dotnet-version: ${{ env.LATEST_NET_VERSION }}
                    dotnet-quality: 'ga'

            -   name: Locate the .NET install
                id: dotnet-root
                shell: bash
                run: |
                    p=$(dirname "$(readlink -f "$(command -v dotnet)")"); echo "path=$p" | tee -a "$GITHUB_OUTPUT"
                    echo "sdk=$(dotnet --version)" | tee -a "$GITHUB_OUTPUT"
                    wv=$(dotnet workload search version --take 1); test -n "$wv" || { echo '::error::No workload set found for this SDK band.'; exit 1; }; echo "workload-version=$wv" | tee -a "$GITHUB_OUTPUT"

            # global.json rolls forward to the newest SDK on the runner, which can be newer than the one setup-dotnet installed, and the
            # runners install workload sets, so the key names the SDK that runs and the newest workload set of its band, and the install
            # pins that version: a new workload release starts a new cache instead of being hidden by an old one.
            -   name: Cache .NET workload packs
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: |
                        ${{ steps.dotnet-root.outputs.path }}/packs
                        ${{ steps.dotnet-root.outputs.path }}/sdk-manifests
                        ${{ steps.dotnet-root.outputs.path }}/metadata/workloads
                        ${{ steps.dotnet-root.outputs.path }}/template-packs
                    key: dotnet-workload-maui-${{ runner.os }}-${{ runner.arch }}-${{ steps.dotnet-root.outputs.sdk }}-${{ steps.dotnet-root.outputs.workload-version }}

            # Keyed on the files that decide which packages a restore needs. A changed key restores from nuget.org (about 5 s for these projects
            # on the runners), and the job saves the cache when it succeeds.
            -   name: Cache NuGet packages
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: ~/.nuget/packages
                    key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'NuGet.config', 'global.json', '.config/dotnet-tools.json') }}

            # Restore evaluates every target framework of the toolkit libraries, so Android and iOS are needed too.
            -   name: Install .NET MAUI Workload
                run: dotnet workload install maui --version ${{ steps.dotnet-root.outputs.workload-version }}

            -   name: Display dotnet info
                run: dotnet --info

            -   name: Restore .NET tools
                id: tools
                run: dotnet tool restore

            -   name: Runner diagnostics
                run: |
                    sw_vers
                    csrutil status || true
                    sysctl -n hw.ncpu hw.memsize
                    system_profiler SPAudioDataType SPCameraDataType || true

            # Four camera permission tests need an audio input, and audio playback has stalled on runner VMs without audio devices
            # (actions/runner-images #9330, #10902, #11251). The images no longer include BlackHole (#9487); restarting coreaudiod makes
            # it appear without a reboot (#11746).
            -   name: Audio devices
                run: |
                    if system_profiler SPAudioDataType | grep -q 'Input Channels'; then
                        echo 'The runner has an audio input.'
                        exit 0
                    fi
                    if brew install --cask blackhole-2ch && sudo killall coreaudiod; then
                        sleep 5
                        system_profiler SPAudioDataType
                    fi
                    if ! system_profiler SPAudioDataType | grep -q 'Input Channels'; then
                        echo '::warning::No audio input on this runner: the tests that need one skip.'
                    fi

            # CI only (a headless run cannot answer the permission prompts). On macOS 27 the per-user TCC database is under
            # /private/var/containers/Data/ProtectedSystem, found the way the runner image's configure-tccdb-macos-27.sh finds it; writing it
            # needs sudo and SIP off, which the runner VMs have. Without it the app keeps undecided permissions and those tests skip, so a
            # grant that cannot be written only warns, as on the iOS simulator (ios.ps1), and the app is still built and tested.
            -   name: Grant camera, microphone and speech recognition to the test app
                run: |
                    db=$(sudo find /private/var/containers/Data/ProtectedSystem -mindepth 6 -maxdepth 6 -type f -path '*/Data/Library/Application Support/com.apple.TCC/TCC.db' 2>/dev/null || true)
                    if [ "$(printf '%s\n' "$db" | grep -c .)" -ne 1 ]; then
                        db=$(sudo lsof -c tccd -Fn | sed -n 's/^n//p' | grep '/ProtectedSystem/.*/com\.apple\.TCC/TCC\.db$' | sort -u | head -n 1)
                    fi
                    if [ -z "$db" ]; then
                        echo '::warning::No user TCC database found; the app keeps undecided permissions.'
                        exit 0
                    fi
                    now=$(date +%s)
                    for app in com.communitytoolkit.maui.devicetests; do
                        for service in kTCCServiceCamera kTCCServiceMicrophone kTCCServiceSpeechRecognition; do
                            if ! sudo sqlite3 -cmd '.timeout 5000' "$db" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,csreq,policy_id,indirect_object_identifier_type,indirect_object_identifier,indirect_object_code_identity,flags,last_modified,pid,pid_version,boot_uuid,last_reminded) VALUES ('$service','$app',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$now,NULL,NULL,'UNUSED',$now);"; then
                                echo "::warning::Could not grant $service to $app in $db; the app keeps an undecided permission."
                            fi
                        done
                    done
                    sudo sqlite3 -cmd '.timeout 5000' "$db" "SELECT service, client, auth_value FROM access WHERE client LIKE 'com.communitytoolkit.maui.%';" || true

            # A job that collects coverage builds in its test step instead: the app is built once, with the instrumented toolkit assemblies,
            # and the coverlet process that instrumented them must still run when the tests have run (eng/devices/README.md, "Code coverage").
            -   name: Build device test apps
                if: ${{ env.DEVICE_TEST_COVERAGE != 'true' }}
                run: pwsh ./eng/devices/run.ps1 -Platform maccatalyst -Target buildOnly -Configuration "$DEVICE_TEST_CONFIGURATION"

            # 30 minutes: the tests of every package took 7.6 minutes on this runner.
            -   name: Run device tests
                if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
                run: pwsh ./eng/devices/run.ps1 -Platform maccatalyst -Target ${{ env.DEVICE_TEST_COVERAGE == 'true' && 'buildAndTest' || 'testOnly' }} -Configuration "$DEVICE_TEST_CONFIGURATION" -Timeout 00:30:00

            -   name: Upload device test results
                if: always()
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
                with:
                    name: device-tests-maccatalyst
                    path: |
                        artifacts/device-tests/
                        artifacts/logs/

            -   name: Upload device test coverage
                if: ${{ !cancelled() && env.DEVICE_TEST_COVERAGE == 'true' }}
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
                with:
                    name: coverage-device-tests-maccatalyst
                    path: artifacts/device-tests/maccatalyst/coverage/*.cobertura.xml
                    if-no-files-found: warn

    device_tests_windows:
        name: Device Tests (Windows ${{ matrix.packaging }})
        permissions:
            contents: read
        # Pinned: windows-latest, windows-2025 and windows-2025-vs2026 run the same image today (Windows Server 2025, x64), but windows-latest
        # moves on.
        runs-on: windows-2025
        timeout-minutes: 100
        strategy:
            fail-fast: false
            matrix:
                packaging: [ packaged, unpackaged ]
        env:
            # VideoRendering: the runner has no GPU (Direct3D on WARP), and no run has shown its MediaPlayer rendering the H.264 test clip, so the
            # 48 MediaElement tests that need rendering are skipped here; local runs keep them. Delete it when a run-everything run shows them
            # passing. Camera: the runner has none; delete it if the job gains one (for example a virtual camera).
            DEVICE_TEST_SKIP_CAPABILITIES: ${{ !inputs.run-everything && 'VideoRendering,Camera' || '' }}
            # MediaPlayback: this job installs Media Foundation, so the MediaElement tests fail, instead of skipping, when no MediaPlayer or
            # H.264 decoder works. WebView2: the image has the runtime that the map tests host.
            DEVICE_TEST_REQUIRE_CAPABILITIES: 'MediaPlayback,WebView2'
        steps:
            -   name: Checkout code
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Load shared environment variables
                uses: ./.github/actions/load-shared-env

            # The MediaElement tests need Media Foundation, which the Windows Server runner images do not install (Server-Media-Foundation is
            # not among the windowsFeatures of actions/runner-images). It installs in a few minutes without a restart; none is possible here,
            # so if the feature asks for one, the step warns and the tests decide: DEVICE_TEST_REQUIRE_CAPABILITIES (MediaPlayback) makes them
            # fail when media playback is unavailable. It runs first, so that a broken install shows before the long build.
            -   name: Install Media Foundation
                shell: powershell
                run: |
                    if (-not (Get-Command Get-WindowsFeature -ErrorAction SilentlyContinue)) {
                        Write-Output 'No ServerManager module (client Windows): Media Foundation is part of the operating system.'
                        exit 0
                    }
                    $feature = Get-WindowsFeature -Name Server-Media-Foundation
                    if ($null -eq $feature) {
                        throw 'This Windows Server has no Server-Media-Foundation feature.'
                    }
                    if ($feature.InstallState -ne 'Installed') {
                        $result = Install-WindowsFeature -Name Server-Media-Foundation
                        if (-not $result.Success) {
                            throw "Install-WindowsFeature Server-Media-Foundation failed (exit code $($result.ExitCode))."
                        }
                        if ("$($result.RestartNeeded)" -ne 'No') {
                            Write-Output "::warning::Server-Media-Foundation reports RestartNeeded=$($result.RestartNeeded); the runner cannot restart, so the MediaElement tests show whether media playback works without it."
                        }
                    }
                    Get-WindowsFeature -Name Server-Media-Foundation | Format-Table -AutoSize Name, InstallState

            -   name: Install .NET SDK v${{ env.TOOLKIT_NET_VERSION }}
                uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
                with:
                    dotnet-version: ${{ env.TOOLKIT_NET_VERSION }}
                    dotnet-quality: 'ga'

            # Keyed on the files that decide which packages a restore needs. A changed key restores from nuget.org (about 5 s for these projects
            # on the runners), and the job saves the cache when it succeeds.
            -   name: Cache NuGet packages
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: ~/.nuget/packages
                    key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'NuGet.config', 'global.json', '.config/dotnet-tools.json') }}

            # Restore evaluates every target framework of the toolkit libraries, so every MAUI platform is needed.
            -   name: Install .NET MAUI Workload
                id: workload
                run: dotnet workload install maui

            -   name: Display dotnet info
                run: dotnet --info

            # No test needs an audio device here: the MediaElement test clip has no audio track, and the speech tests adapt to a machine
            # without a microphone or a recognizer. If the recognizers below appear, a virtual audio device and microphone consent would
            # let more speech tests run.
            -   name: Runner diagnostics
                shell: powershell
                run: |
                    Get-ComputerInfo -Property OsName, OsVersion, CsNumberOfLogicalProcessors, CsTotalPhysicalMemory | Format-List
                    Get-CimInstance Win32_VideoController | Format-Table -AutoSize Name, CurrentHorizontalResolution, CurrentVerticalResolution
                    Get-PnpDevice -Class Camera, Image, AudioEndpoint -ErrorAction SilentlyContinue | Format-Table -AutoSize Class, FriendlyName, Status
                    Get-AppxPackage -Name '*WindowsAppRuntime*' | Format-Table -AutoSize Name, Version, Architecture
                    Add-Type -AssemblyName System.Speech
                    'System.Speech recognizers: ' + (([System.Speech.Recognition.SpeechRecognitionEngine]::InstalledRecognizers() | ForEach-Object { $_.Culture.Name }) -join ', ')

            # The default is 1024x768; 1920x1080 is the largest mode (actions/runner-images #2935).
            -   name: Set the display resolution
                shell: powershell
                run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

            -   name: Allow sideloading
                if: matrix.packaging == 'packaged'
                shell: powershell
                run: |
                    reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /v AllowAllTrustedApps /t REG_DWORD /d 1 /f
                    reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /v AllowDevelopmentWithoutDevLicense /t REG_DWORD /d 1 /f

            # run.ps1 runs windows.ps1 in the same process, so in Windows PowerShell 5.1, which has the Appx and PKI cmdlets the packaged run needs.
            -   name: Build device test apps
                shell: powershell
                run: .\eng\devices\run.ps1 -Platform windows-${{ matrix.packaging }} -Target buildOnly -Configuration $env:DEVICE_TEST_CONFIGURATION

            -   name: Run device tests
                if: ${{ !cancelled() && steps.workload.outcome == 'success' }}
                shell: powershell
                run: .\eng\devices\run.ps1 -Platform windows-${{ matrix.packaging }} -Target testOnly -Configuration $env:DEVICE_TEST_CONFIGURATION -Timeout 00:30:00

            -   name: Upload device test results
                if: always()
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
                with:
                    name: device-tests-windows-${{ matrix.packaging }}
                    path: |
                        artifacts/device-tests/
                        artifacts/logs/

    # The single status check to require in branch protection ("Device Tests / Device Tests" in a Build run).
    device_tests:
        name: Device Tests
        if: ${{ always() }}
        # A failed app build skips device_tests_ios_runtime, and the check below counts a skipped job as not succeeded.
        needs: [ device_tests_android, device_tests_ios, device_tests_ios_app, device_tests_ios_runtime, device_tests_maccatalyst, device_tests_windows ]
        runs-on: ubuntu-latest
        permissions: {}
        timeout-minutes: 5
        steps:
            -   name: Check device test jobs
                env:
                    NEEDS: ${{ toJSON(needs) }}
                    ANY_JOB_NOT_SUCCEEDED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
                run: |
                    echo "$NEEDS"
                    if [ "$ANY_JOB_NOT_SUCCEEDED" = "true" ]; then
                        echo "::error::One or more device test jobs did not succeed."
                        exit 1
                    fi
