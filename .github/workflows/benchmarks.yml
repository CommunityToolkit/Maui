name: Benchmarks

on:
    push:
        branches:
            - main
        tags:
            - '*'
        paths-ignore:
            - README.md
    pull_request:
        branches:
            - '*'

env:
    PathToCommunityToolkitAnalyzersBenchmarksCsproj: 'src/CommunityToolkit.Maui.Analyzers.Benchmarks/CommunityToolkit.Maui.Analyzers.Benchmarks.csproj'
    PathToCommunityToolkitSourceGeneratorsBenchmarksCsproj: 'src/CommunityToolkit.Maui.SourceGenerators.Benchmarks/CommunityToolkit.Maui.SourceGenerators.Benchmarks.csproj'

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    run_benchmarks:
        name: Run Benchmarks
        runs-on: windows-latest            
        steps:
            -   name: Checkout code
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Load shared environment variables
                uses: ./.github/actions/load-shared-env

            -   name: Install Latest Version of .NET, v${{ env.LATEST_NET_VERSION }}
                uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
                with:
                    dotnet-version: ${{ env.LATEST_NET_VERSION }}
                    dotnet-quality: 'ga'

            -   name: Install .NET MAUI Workload
                run: |
                    dotnet workload install maui
                    dotnet workload update

            -   name: Display dotnet info
                run: dotnet --info

            -   name: Run Analyzer Benchmarks
                run: dotnet run --project ${{ env.PathToCommunityToolkitAnalyzersBenchmarksCsproj }} -c Release -- -a "${{ runner.temp }}"

            -   name: Run Source Generator Benchmarks
                run: |
                    dotnet build-server shutdown
                    dotnet build ${{ env.PathToCommunityToolkitSourceGeneratorsBenchmarksCsproj }} -c Release -m:1 --disable-build-servers
                    dotnet run --no-build --project ${{ env.PathToCommunityToolkitSourceGeneratorsBenchmarksCsproj }} -c Release -- -a "${{ runner.temp }}"

            -   name: Publish Benchmarks
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
                with:
                    name: Benchmarks
                    path: |
                        ${{ runner.temp }}/**/*.md
